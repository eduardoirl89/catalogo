<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Web de Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===================================================================
         HEADER
         =================================================================== -->
    <header class="app-header" id="topBar">
        <div class="header-company">
            <a class="company-badge" id="companyBadgeLink" href="#" target="_blank" rel="noopener" aria-label="Ver ubicación en Google Maps" title="Ver ubicación">
                <span class="company-badge-fallback" id="companyBadgeFallback">🏢</span>
                <img id="companyBadgeLogo" class="company-badge-logo" src="" alt="Logo" style="display:none;">
            </a>
            <div class="company-info">
                <span class="company-name-header" id="sessionLabel">Invitado / Sin Empresa</span>
                <span class="company-rif-header" id="headerRif"></span>
            </div>
        </div>

        <div class="header-search">
            <label for="topSearchInput" class="visually-hidden">Buscar producto</label>
            <input type="text" id="topSearchInput" placeholder="🔍  Buscar producto, marca o código..." aria-label="Buscar producto">
        </div>

        <div class="header-actions">
            <button class="header-btn btn-filters-header" onclick="openFiltersModal()" title="Filtros" aria-label="Filtros">
                <span class="icon">⚙</span>
                <span class="label">Filtros</span>
                <span class="filters-badge" id="filtersBadge" hidden>0</span>
            </button>
            <button class="header-btn btn-pdf-header" onclick="prepareAndPrint()" title="Exportar PDF" aria-label="Exportar PDF">
                <span class="icon">📄</span>
                <span class="label">PDF</span>
            </button>
            <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMainMenu()" aria-label="Abrir menú" aria-expanded="false" aria-controls="mainDropdownMenu">☰</button>
        </div>

        <nav class="main-dropdown-menu" id="mainDropdownMenu" aria-hidden="true">
            <button class="btn-pdf" onclick="prepareAndPrint()">EXPORTAR PDF</button>
        </nav>
    </header>

    <!-- ===================================================================
         FILTROS (barra horizontal - desktop)
         =================================================================== -->
    <div class="filter-bar" id="filterBar">
        <div class="filter-bar-inner">

            <!-- CATEGORÍA -->
            <div class="multifilter" data-filter="category">
                <button class="multifilter-btn" type="button" onclick="toggleMultifilter('category')">
                    <span class="multifilter-label">Categoría</span>
                    <span class="multifilter-count" id="categoryCount" hidden>0</span>
                    <span class="multifilter-arrow">▾</span>
                </button>
                <div class="multifilter-menu" id="categoryMenu">
                    <div class="multifilter-menu-header">
                        <label class="multifilter-all">
                            <input type="checkbox" id="categoryAllCheckbox" onchange="toggleAllFilter('category', this.checked)">
                            <span>Todas</span>
                        </label>
                    </div>
                    <div class="multifilter-menu-body" id="categoryOptions"></div>
                </div>
            </div>

            <!-- MARCA -->
            <div class="multifilter" data-filter="brand">
                <button class="multifilter-btn" type="button" onclick="toggleMultifilter('brand')">
                    <span class="multifilter-label">Marca</span>
                    <span class="multifilter-count" id="brandCount" hidden>0</span>
                    <span class="multifilter-arrow">▾</span>
                </button>
                <div class="multifilter-menu" id="brandMenu">
                    <div class="multifilter-menu-header">
                        <label class="multifilter-all">
                            <input type="checkbox" id="brandAllCheckbox" onchange="toggleAllFilter('brand', this.checked)">
                            <span>Todas</span>
                        </label>
                        <input type="text" class="multifilter-search" id="brandSearchInput" placeholder="Buscar marca..." oninput="filterBrandOptions(this.value)">
                    </div>
                    <div class="multifilter-menu-body" id="brandOptions"></div>
                </div>
            </div>

            <!-- ORDENAR -->
            <div class="filter-item-simple">
                <select id="sortSelect" onchange="syncAndFilter('sort', this.value)" aria-label="Ordenar por">
                    <option value="default">Por defecto</option>
                    <option value="name-asc">Nombre (A - Z)</option>
                    <option value="name-desc">Nombre (Z - A)</option>
                    <option value="price-asc">Precio: Menor a Mayor</option>
                    <option value="price-desc">Precio: Mayor a Menor</option>
                    <option value="category-asc">Categoría (A - Z)</option>
                    <option value="category-desc">Categoría (Z - A)</option>
                    <option value="brand-asc">Marca (A - Z)</option>
                    <option value="brand-desc">Marca (Z - A)</option>
                </select>
            </div>

            <button class="filter-clear-btn" id="clearFiltersBtn" onclick="clearAllFilters()" title="Limpiar filtros">
                ✕ Limpiar
            </button>
        </div>

        <!-- Chips compactos -->
        <div class="filter-chips-wrapper" id="filterChipsWrapper" style="display:none;">
            <div class="filter-chips" id="filterChips"></div>
        </div>
    </div>

    <!-- ===================================================================
         MODAL DE FILTROS (MÓVIL)
         =================================================================== -->
    <div class="filters-modal-overlay" id="filtersModalOverlay" onclick="closeFiltersModalIfOutside(event)">
        <div class="filters-modal" role="dialog" aria-modal="true" aria-labelledby="filtersModalTitle">
            <div class="filters-modal-header">
                <h3 id="filtersModalTitle">Filtros</h3>
                <button class="filters-modal-close" onclick="closeFiltersModal()" aria-label="Cerrar filtros">✕</button>
            </div>

            <div class="filters-modal-body">
                <div class="filters-modal-section">
                    <div class="filters-modal-section-title">Categoría</div>
                    <div class="filters-modal-options" id="modalCategoryOptions"></div>
                </div>

                <div class="filters-modal-section">
                    <div class="filters-modal-section-title">Marca</div>
                    <input type="text" class="multifilter-search" id="modalBrandSearchInput" placeholder="Buscar marca..." oninput="filterModalBrandOptions(this.value)">
                    <div class="filters-modal-options" id="modalBrandOptions"></div>
                </div>

                <div class="filters-modal-section">
                    <div class="filters-modal-section-title">Ordenar por</div>
                    <select id="modalSortSelect" onchange="syncAndFilter('sort', this.value)">
                        <option value="default">Por defecto</option>
                        <option value="name-asc">Nombre (A - Z)</option>
                        <option value="name-desc">Nombre (Z - A)</option>
                        <option value="price-asc">Precio: Menor a Mayor</option>
                        <option value="price-desc">Precio: Mayor a Menor</option>
                        <option value="category-asc">Categoría (A - Z)</option>
                        <option value="category-desc">Categoría (Z - A)</option>
                        <option value="brand-asc">Marca (A - Z)</option>
                        <option value="brand-desc">Marca (Z - A)</option>
                    </select>
                </div>
            </div>

            <div class="filters-modal-footer">
                <button class="filters-modal-btn btn-secondary" onclick="clearAllFilters()">Limpiar todo</button>
                <button class="filters-modal-btn btn-primary" onclick="closeFiltersModal()">Aplicar</button>
            </div>
        </div>
    </div>

    <!-- ===================================================================
         CONTENIDO
         =================================================================== -->
    <main class="content-area">
        <!-- Portada (solo PDF) -->
        <section class="pdf-cover" id="pdfCoverSection">
            <div class="cover-top">
                <span class="cover-date" id="coverFooterDate">OCTUBRE 2026</span>
                <span class="cover-title-inline" id="coverTitleInline">CATÁLOGO DE PRODUCTOS</span>
            </div>

            <div class="cover-body">
                <div class="cover-top-half">
                    <img id="companyLogoImg" class="company-logo-img" src="" alt="Logo Empresa" style="display:none;">
                </div>

                <div class="cover-center">
                    <span class="company-name" id="coverCompanyName">MI EMPRESA C.A.</span>
                    <span class="cover-rif" id="coverFooterRif">J-00000000-0</span>
                </div>

                <div class="cover-bottom-half">
                    <img id="qrLogoImg" class="qr-logo-img" src="" alt="Código QR" style="display:none;">
                </div>

                <div class="cover-social">
                    <a id="coverFooterSocialLink" href="#" target="_blank" rel="noopener">
                        <span id="coverFooterSocial">@miempresa</span>
                    </a>
                </div>
            </div>

            <div class="cover-footer">
                <div class="cover-footer-col">
                    <a id="coverFooterContactLink" href="#" target="_blank" rel="noopener">
                        <span id="coverFooterContact">+58 000 0000000</span>
                    </a>
                    <a id="coverFooterAddressLink" href="#" target="_blank" rel="noopener">
                        <span id="coverFooterAddress">Ciudad Bolívar, Venezuela</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- Contador de resultados -->
        <div class="results-info" id="resultsInfo" style="display:none;">
            <span id="resultsCount">Mostrando 0 productos</span>
        </div>

        <!-- Contenedor de productos -->
        <div id="catalogContainer" class="cols-4"></div>
    </main>

    <!-- WhatsApp flotante -->
    <a href="#" class="whatsapp-float-btn" id="whatsappBtn" onclick="shareCatalogWhatsApp(event)" title="Compartir por WhatsApp" aria-label="Compartir por WhatsApp">
        <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
    </a>

    <!-- Overlay PDF -->
    <div class="pdf-loading-overlay" id="pdfLoadingOverlay" aria-hidden="true">
        <div class="pdf-loading-box">
            <div class="pdf-loading-spinner"></div>
            <p class="pdf-loading-text">Preparando catálogo para PDF...</p>
            <p class="pdf-loading-subtext" id="pdfLoadingSubtext">Cargando imágenes (0/0)</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
