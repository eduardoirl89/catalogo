<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Web de Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TOP BAR (BARRA SUPERIOR DE NAVEGACIÓN) -->
    <header class="top-bar" id="topBar">
        <div class="top-bar-left">
            <div class="user-session-info" id="sessionLabel">Invitado / Sin Empresa</div>
        </div>

        <!-- BARRA DE BÚSQUEDA INTEGRADA EN EL TOP-BAR -->
        <div class="top-search-box">
            <input type="text" id="topSearchInput" placeholder="Buscar producto..." oninput="syncAndFilter('search', this.value)">
        </div>
        
        <!-- BOTÓN HAMBURGUESA GENERAL -->
        <button class="hamburger-btn" onclick="toggleMainMenu()" aria-label="Menú">☰</button>

        <!-- MENÚ DESPLEGABLE PRINCIPAL DE OPCIONES -->
        <nav class="main-dropdown-menu" id="mainDropdownMenu">
            <button class="btn-company-option mobile-only-btn" onclick="toggleCompanyCoverMobile()">EMPRESA</button>
            <button class="btn-pdf" onclick="window.print()">EXPORTAR PDF</button>
        </nav>
    </header>

    <!-- BARRA SECUNDARIA RESPONSIVE (SOLO MÓVIL) -->
    <div class="secondary-bar" id="secondaryBar">
        <div class="secondary-filter-item">
            <select id="mobileCategorySelect" onchange="syncAndFilter('category', this.value)">
                <option value="all">Todas las categorías</option>
            </select>
        </div>
        <div class="secondary-filter-item">
            <select id="mobileBrandSelect" onchange="syncAndFilter('brand', this.value)">
                <option value="all">Todas las marcas</option>
            </select>
        </div>
        <div class="secondary-filter-item">
            <select id="mobileSortSelect" onchange="syncAndFilter('sort', this.value)">
                <option value="default">Por defecto</option>
                <option value="name-asc">Nombre (A - Z)</option>
                <option value="name-desc">Nombre (Z - A)</option>
                <option value="price-asc">Precio: Menor a Mayor</option>
                <option value="price-desc">Precio: Mayor a Menor</option>
                <option value="category-asc">Categoría (A - Z)</option>
                <option value="category-desc">Categoría (Z - A)</option>
                <option value="brand-asc">Marca (A - Z)</option>
                <option value="brand-desc">Marca (Z - A)</option>
            </select>
        </div>
    </div>

    <!-- LAYOUT PRINCIPAL -->
    <div class="main-layout">
        
        <!-- SIDEBAR DE FILTROS Y ORDENAMIENTO (ESCRITORIO) -->
        <aside class="sidebar-filters" id="sidebarMenu">
            <div class="sidebar-header">
                <h3>Filtros</h3>
            </div>

            <div class="filter-group">
                <label for="categorySelect">Categoría</label>
                <select id="categorySelect" onchange="syncAndFilter('category', this.value)">
                    <option value="all">Todas las categorías</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="brandSelect">Marca</label>
                <select id="brandSelect" onchange="syncAndFilter('brand', this.value)">
                    <option value="all">Todas las marcas</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sortSelect">Ordenar por</label>
                <select id="sortSelect" onchange="syncAndFilter('sort', this.value)">
                    <option value="default">Por defecto (Categoría A-Z, Marca A-Z)</option>
                    <option value="name-asc">Nombre (A - Z)</option>
                    <option value="name-desc">Nombre (Z - A)</option>
                    <option value="price-asc">Precio: Menor a Mayor</option>
                    <option value="price-desc">Precio: Mayor a Menor</option>
                    <option value="category-asc">Categoría (A - Z)</option>
                    <option value="category-desc">Categoría (Z - A)</option>
                    <option value="brand-asc">Marca (A - Z)</option>
                    <option value="brand-desc">Marca (Z - A)</option>
                </select>
            </div>
        </aside>

        <!-- ÁREA DE CONTENIDO -->
        <main class="content-area">
            
            <!-- PORTADA / MEMBRETE DE EMPRESA -->
            <section class="pdf-cover" id="pdfCoverSection">
                <div class="cover-header">
                    <span class="company-name" contenteditable="true">MI EMPRESA C.A.</span>
                    <span class="cover-title-inline" contenteditable="true">CATÁLOGO DE PRODUCTOS</span>
                    <span class="cover-rif" contenteditable="true">RIF: J-00000000-0</span>
                </div>
                
                <div class="cover-body">
                    <div class="cover-top-half">
                        <img id="companyLogoImg" class="company-logo-img" src="" alt="Logo Empresa" style="display:none;">
                    </div>

                    <div class="cover-bottom-half">
                        <img id="qrLogoImg" class="qr-logo-img" src="" alt="Código QR" style="display:none;">
                    </div>
                </div>
                
                <div class="cover-footer">
                    <span contenteditable="true">RIF: J-00000000-0</span>
                    <span contenteditable="true">Contacto: +58 000 0000000</span>
                    <span contenteditable="true">Redes: @miempresa</span>
                    <span contenteditable="true">Dirección: Ciudad Bolívar, Venezuela</span>
                    <span contenteditable="true">Fecha: SEPTIEMBRE 2026</span>
                </div>
            </section>

            <!-- FRANJA HORIZONTAL DINÁMICA -->
            <div class="category-brand-strip" id="categoryBrandStrip">
                <span class="strip-value" id="stripActiveCategory">CARGANDO...</span>
            </div>

            <!-- CONTENEDOR DINÁMICO DE PRODUCTOS -->
            <div id="catalogContainer" class="cols-4"></div>

        </main>
    </div>

    <!-- BOTÓN FLOTANTE DE WHATSAPP -->
    <a href="#" class="whatsapp-float-btn" id="whatsappBtn" onclick="shareCatalogWhatsApp(event)" title="Compartir por WhatsApp">
        🟢 WhatsApp
    </a>

    <script src="script.js"></script>
</body>
</html>
