<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Encabezado / Buscador -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-boxes-stacked"></i>
                <h2>Mi Catálogo</h2>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar por código, nombre o categoría...">
                <button id="clearSearch" class="clear-btn" style="display: none;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="header-actions">
                <span id="productCount" class="badge">0 Productos</span>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">
        <!-- Filtros Lateral/Superior -->
        <aside class="filters-sidebar">
            <h3>Categorías</h3>
            <ul id="categoriesList" class="categories-list">
                <li class="active" data-category="all">
                    <span>Todas</span>
                    <span class="count-pill" id="count-all">0</span>
                </li>
                <!-- Se puebla dinámicamente -->
            </ul>
        </aside>

        <!-- Rejilla de Productos -->
        <section class="products-section">
            <div id="productsGrid" class="products-grid">
                <!-- Se puebla dinámicamente con JS -->
            </div>
            <div id="noResults" class="no-results" style="display: none;">
                <i class="fas fa-search-minus fa-3x"></i>
                <p>No se encontraron productos que coincidan con la búsqueda.</p>
            </div>
        </section>
    </main>

    <!-- Modal para Detalle de Imagen/Producto -->
    <div id="imageModal" class="modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="modal-content-wrapper">
            <div id="modalImageContainer" class="modal-img-container">
                <!-- Imagen renderizada dinámicamente con <picture> -->
            </div>
            <div class="modal-info">
                <h3 id="modalTitle"></h3>
                <p id="modalCode" class="modal-code"></p>
                <p id="modalCategory" class="modal-category"></p>
                <p id="modalPrice" class="modal-price"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
